/* ================= lógica del partido ================= */

function prepKick(){
  G.phase="aim";G.charging=false;
  ball.mode="rest";ball.X=0;ball.Y=BALL_R;ball.Z=11;ball.vx=ball.vy=ball.vz=0;ball.hidden=false;ball.trail=[];ball.spin=0;

function classify(im){
  var x=Math.abs(im.x),y=im.y;
  if(x<3.50&&y<2.37)return "in";
  if(x>=3.50&&x<=3.82&&y<2.6)return "post";
  if(y>=2.37&&y<=2.6&&x<3.82)return "bar";
  return "miss";
}
function startShot(aim,p){
  G.phase="run";
  var ang=rand(0,TAU),rr=errR(p)*Math.sqrt(Math.random());
  var im={x:aim.x+Math.cos(ang)*rr,y:Math.max(0.06,aim.y+Math.sin(ang)*rr)};
  var type=classify(im),speed=lerp(15,31,p)*(1+statPower()),ez=(type==="post"||type==="bar")?0:0.35,T=(11-ez)/speed;
  var R=ROUNDS[G.round],kt;
  if(type==="miss")kt={x:rand(-2.5,2.5),y:rand(0.4,1.8)};
  else if(Math.random()<R.guess)kt={x:im.x+rand(-0.4,0.4),y:im.y+rand(-0.35,0.35)};
  else kt={x:(Math.random()<0.18?rand(-0.5,0.5):(Math.random()<0.5?-1:1)*rand(1.2,3.2)),y:rand(0.2,2.1)};
  var bodyX=clamp(kt.x*0.62,-2.9,2.9),hip=clamp(0.38+kt.y*0.55,0.5,1.55),delay=R.delay+rand(-0.02,0.04);
  var pd=ease((T-delay)/0.5),hx=lerp(0,bodyX,pd),hy=lerp(0.93,hip,pd),L=1.32*(1-ballDef().luck);
  var saved=(type==="in")&&Math.hypot(im.x-hx,im.y-hy)<=L;
  var tx=saved?im.x:kt.x,ty=saved?im.y:kt.y,dx=tx-hx,dy=ty-hy;
  var plan={delay:delay,T:T,hx:hx,hy:hy,lean:clamp(Math.atan2(dx,dy),-1.5,1.5),ext:clamp(Math.hypot(dx,dy)/1.32,0.2,1),saved:saved};
  shot={aim:aim,p:p,imp:im,type:type,speed:speed,T:T,ez:ez,plan:plan,launched:false,fl0:0,goal:false,netHit:false};
  shooter.mode="run";shooter.t0=NOW;
}
function launch(){bootBurst();shot.launched=true;ball.mode="flight";shot.fl0=NOW;ball.trail=[];keeper.plan=shot.plan;}
function flightPos(k){
  var f=shot;return {X:lerp(0,f.imp.x,k),Z:lerp(11,f.ez,k),Y:lerp(BALL_R,f.imp.y,Math.pow(k,1.15))+0.5*(1-f.p)*4*k*(1-k)};
}
function finishShot(scored){
  G.meDots.push(scored?1:0);
  if(scored){G.me++;save.coins+=5;persist();updateCoins();shot.goal=true;G.cheer=1;G.waveUntil=0;G.shake=5;burst();}
  later(1800,afterKick);
}
function resolve(){
  var type=shot.type,pl=shot.plan,T=shot.T,e=flightPos(1),e0=flightPos(0.97);
  ball.X=e.X;ball.Y=e.Y;ball.Z=e.Z;
  ball.vx=(e.X-e0.X)/(0.03*T);ball.vy=(e.Y-e0.Y)/(0.03*T);ball.vz=(e.Z-e0.Z)/(0.03*T);ball.mode="free";var q0=proj(e.X,e.Y,e.Z);skinBurst(q0.x,q0.y,(type==="in"&&!pl.saved)?1:0.7);
  if(type==="in"&&!pl.saved){banner("¡GOOOL!","#86efac");finishShot(true);}
  else if(type==="in"){ball.vz=rand(3,6);ball.vx=rand(-3.5,3.5)+pl.lean*2;ball.vy=rand(1.5,4);banner("¡PARADÓN!","#93c5fd");G.shake=4;finishShot(false);}
  else if(type==="miss"){banner(e.Y>2.4?"¡POR ENCIMA!":"¡FUERA!","#fca5a5");finishShot(false);}
  else{
    G.shake=8;
    if(Math.random()<0.3){ball.vx=-(e.X>=0?1:-1)*1.5*(type==="post"?1:0);ball.vz=-4;ball.vy=-0.5;banner("¡ENTRA POR EL "+(type==="post"?"POSTE":"LARGUERO")+"!","#fde68a");finishShot(true);}
    else{ball.vz=rand(3,6);ball.vx=(type==="post"?(e.X>=0?1:-1)*rand(1,3):rand(-2,2));ball.vy=type==="bar"?-Math.abs(ball.vy)*0.5-1.5:rand(0,2);banner(type==="post"?"¡AL POSTE!":"¡AL LARGUERO!","#fde68a");finishShot(false);}
  }
}
function afterKick(){shooter.mode="gone";rivalTurn();}
function rivalTurn(){
  G.phase="rival";banner("TURNO DEL RIVAL","#93c5fd");setHint("Dispara "+ROUNDS[G.round].rival+"...");
  later(1300,function(){
    var goal=Math.random()<ROUNDS[G.round].cpu;
    G.cpuDots.push(goal?1:0);if(goal)G.cpu++;

function afterPair(){
  G.pairs++;

    if(G.pairs>=5){
      if(G.me>G.cpu)return winRound();
      if(G.me<G.cpu)return lose();
      G.golden=true;banner("⚡ GOL DE ORO","#fde047");
    }
  }else{
    var m=G.meDots[G.meDots.length-1],c=G.cpuDots[G.cpuDots.length-1];
    if(m&&!c)return winRound();

}
function winRound(){

    G.phase="between";
    showOv("¡Ganaste la tanda!","Pasas a "+ROUNDS[G.round+1].name+" contra "+ROUNDS[G.round+1].rival+". El marcador vuelve a 0-0.","Siguiente ronda",function(){G.round++;resetRound();prepKick();},"+"+R.prize+" 🪙");
  }else champion(R.prize);

function burst(){for(var i=0;i<70;i++)G.conf.push({x:rand(100,700),y:rand(-20,60),vx:rand(-50,50),vy:rand(40,160),c:["#fde047","#22c55e","#ef4444","#38bdf8","#fff","#fb923c"][i%6],r:rand(0,6),vr:rand(-8,8),l:rand(2,3.5)});}

/* ================= actualización por fotograma ================= */
function updateKeeper(dt){
  var pl=keeper.plan,c=keeper.cur,tgt={x:0,hip:0.93+Math.sin(NOW*2.2)*0.012,lean:0,ext:0.1,mouth:0};
  if(pl&&shot&&shot.launched){
    var tt=NOW-shot.fl0,u=ease((tt-pl.delay)/Math.max(0.05,pl.T-pl.delay));
    tgt.x=lerp(0,pl.hx,u);tgt.hip=lerp(tgt.hip,pl.hy,u);tgt.lean=lerp(0,pl.lean,u);tgt.ext=lerp(0.1,pl.ext,u);tgt.mouth=u;
    if(tt>pl.T&&!pl.saved){var f=ease((tt-pl.T)/0.45);tgt.hip=lerp(tgt.hip,Math.max(0.3,pl.hy*0.45),f);}
    keeper.cur=tgt;
  }else{
    var k=Math.min(1,dt*6);c.x=lerp(c.x,tgt.x,k);c.hip=lerp(c.hip,tgt.hip,k);c.lean=lerp(c.lean,0,k);c.ext=lerp(c.ext,0.1,k);c.mouth=lerp(c.mouth,0,k);
  }
}
function update(dt){
  G.cheer=Math.max(0,G.cheer-dt*0.35);G.shake=Math.max(0,G.shake-dt*18);
  bulgeA=bulge.t0>0?(function(){var tt=NOW-bulge.t0;return tt<0||tt>2.2?0:Math.exp(-3.2*tt)*Math.cos(15*tt)*1.3;})():0;
  if(G.charging)G.power=1-Math.abs(((NOW-G.chargeT0)*0.9)%2-1);
  var S=shooter;
  if(S.mode==="gone")S.alpha=Math.max(0,S.alpha-dt*3);
  else S.alpha=Math.min(1,S.alpha+dt*5);
  if(S.mode==="run"){
    var u=(NOW-S.t0)/RUN;
    if(u>=1){S.mode="kick";S.t0=NOW;S.X=SH_END.X;S.Z=SH_END.Z;S.kk=0;}
    else{S.X=lerp(SH_START.X,SH_END.X,u);S.Z=lerp(SH_START.Z,SH_END.Z,u);S.ph=u*15;}
  }else if(S.mode==="kick"){
    S.kk=(NOW-S.t0)/0.42;
    if(shot&&!shot.launched&&S.kk>=0.5)launch();
    if(S.kk>=1){S.mode="after";S.kk=1;}
  }
  if(ball.mode==="flight"&&shot){
    var k=(NOW-shot.fl0)/shot.T,p=flightPos(Math.min(k,1));
    ball.X=p.X;ball.Y=p.Y;ball.Z=p.Z;ball.spin+=dt*18;
    ball.trail.push([p.X,p.Y,p.Z]);if(ball.trail.length>14)ball.trail.shift();
    if(k>=1)resolve();
  }else if(ball.mode==="free"){
    ball.vy-=9.8*dt;ball.X+=ball.vx*dt;ball.Y+=ball.vy*dt;ball.Z+=ball.vz*dt;ball.spin+=dt*10;
    if(ball.Y<BALL_R){ball.Y=BALL_R;ball.vy=-ball.vy*0.42;ball.vx*=0.82;ball.vz*=0.82;if(Math.abs(ball.vy)<1)ball.vy=0;}
    if(shot&&shot.goal){
      if(!shot.netHit&&ball.Z<-1.75){
        shot.netHit=true;ball.Z=-1.75;ball.vz*=-0.12;ball.vx*=0.25;ball.vy*=0.3;
        var q=proj(ball.X,ball.Y,ball.Z);bulge.t0=NOW;bulge.hx=q.x;bulge.hy=q.y;
      }
      if(shot.netHit){ball.Z=Math.max(ball.Z,-1.75);ball.X=clamp(ball.X,-3.4,3.4);}
    }
    if(ball.Z<-7.8)ball.hidden=true;
    ball.trail.length=0;
  }
  updateKeeper(dt);updateConf(dt);tickFx(dt);updateFx(dt);
}

/* ================= entrada ================= */
function toGoal(e){
  var r=cv.getBoundingClientRect(),px=(e.clientX-r.left)*(W/r.width),py=(e.clientY-r.top)*(H/r.height);
  return {x:clamp((px-CX)/S0,-4.4,4.4),y:clamp(CAMH-(py-YH)/S0,0,3.0)};
}
cv.addEventListener("pointermove",function(e){if(G.phase==="aim")G.aim=toGoal(e);});
cv.addEventListener("pointerdown",function(e){
  if(G.phase!=="aim")return;G.aim=toGoal(e);G.charging=true;G.chargeT0=NOW;G.power=0;
  try{cv.setPointerCapture(e.pointerId);}catch(x){}e.preventDefault();
});
window.addEventListener("pointerup",function(){if(G.charging&&G.phase==="aim"){var p=Math.max(0.12,G.power);G.charging=false;var a=G.aim;setHint("");startShot(a,p);}});
$("restartBtn").onclick=function(){hideOv();hideComps();startTournament();};$("compBtn").onclick=openComps;

/* ================= bucle ================= */
var last=0;
function runTasks(){for(var i=tasks.length-1;i>=0;i--){var tk=tasks[i];if(tk.g!==gen){tasks.splice(i,1);continue;}if(tk.t<=NOW){tasks.splice(i,1);tk.fn();}}}
function frame(ms){
  NOW=ms/1000;var dt=Math.min(0.05,NOW-last);last=NOW;
  runTasks();
  update(dt);render(NOW);if(labCv&&$("shop").className.indexOf("open")>=0){var lc=labCv.getContext("2d");lc.clearRect(0,0,320,190);drawBootSide(lc,save.boots,30,20,1.4,NOW);}

}

var demo=(location.hash.match(/demo=(\w+)/)||[])[1],demoT=parseFloat((location.hash.match(/[&?]t=([\d.]+)/)||[])[1]);
if(demo){
  if(demo==="shop"){openShop();}
  else if(demo==="lab"){shopTab="lab";openShop();}
  else if(demo==="comps"){openComps();}
  else if(demo==="cup"){COMP=COMPS[2];ROUNDS=COMP.rounds;champion(120);}
  else if(demo==="hair"){shopTab="hair";openShop();}
